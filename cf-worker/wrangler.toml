name = "meal-prep-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[kv_namespaces]]
binding = "KV"
id = "33dd3a3f6b1e40ea8b2722ad7d89e13a"
preview_id = "d3f1a027984d410a969378c4b3daec46"

[triggers]
# One tick every 5 minutes. The worker resolves each user's meal times and
# time zone itself (see TICK_MINUTES in src/push.ts) — meal times are per user
# and configurable in the app, so they cannot be encoded in the cron.
crons = [
  "*/5 * * * *"
]

[vars]
VAPID_SUBJECT = "mailto:javasoftwaredeveloper85@gmail.com"
FIREBASE_PROJECT_ID = "meal-prep-37753"
GITHUB_REPO = "n-pilipovic/meal-prep"
# AI model overrides — leave commented to use defaults from src/ai-models.ts.
# Uncomment + redeploy to switch without code changes.
# GEMINI_MODEL = "gemini-2.5-pro"
# GROQ_MODEL = "llama-3.3-70b-versatile"
# Secrets (set via wrangler secret put):
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
#   wrangler secret put GEMINI_API_KEY            # https://aistudio.google.com/apikey
#   wrangler secret put GROQ_API_KEY              # https://console.groq.com/keys
#   wrangler secret put GITHUB_TOKEN              # fine-grained PAT, repo scope: Issues + Contents (write)
#   wrangler secret put GITHUB_ASSETS_RELEASE_ID  # release id for tag "feedback-assets"
#   wrangler secret put GITHUB_WEBHOOK_SECRET     # random secret used for X-Hub-Signature-256 verification
# Generate VAPID keys with: npx web-push generate-vapid-keys
